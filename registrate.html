<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./css/assets/escudo-millos.avif" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>REGISTRATE Y GANA</title>

</head> 

<body class="bg-black">

  <noscript> JavaScript is mandatory. </noscript>



  <header>
    <div class=" container-fluid text-center">
        <div class="row">
          <div class=" text-colorheader s390pxtitulos">
            REGISTRATE Y GANA
          </div>
        </div>
      </div>
 <div class="">
    <img src="./css/assets/solo-millos.png" class=" barras-millos img-fluid" alt="millitos">
 </div>
    </header>

<main>

  <h1 class="textos-index text-center registro-datos">
    Al registrar tus datos estarás participando por miles de premios.</h1>

    <br>

    <div class="container textos-index form-390">
      <div class="row g-2">
        <div class="col-md">
          <div class="form-floating">
            <input type="text" class="form-control" id="floatingInputNombre" placeholder="Tu nombre">
            <label for="floatingInputNombre">Nombre</label>
          </div>
        </div>
        <div class="col-md">
          <div class="form-floating">
            <input type="number" class="form-control" id="floatingInputEdad" placeholder="Tu edad">
            <label for="floatingInputEdad">Edad</label>
          </div>
        </div>
      </div>
      <div class="row g-2 mt-2">
        <div class="col-md">
          <div class="form-floating">
            <input type="tel" class="form-control" id="floatingInputNumero" placeholder="Tu número de teléfono">
            <label for="floatingInputPhone">Número de teléfono</label>
          </div>
        </div>
        <div class="col-md">
          <div class="form-floating">
            <input type="url" class="form-control" id="floatingInputInstagram" placeholder="Link de tu Instagram">
            <label for="floatingInputInstagram">Link de Instagram</label>
          </div>
        </div>
      </div>
      <div class="row g-2 mt-2">
        <div class="col-md">
          <div class="form-floating">
            <input type="email" class="form-control" id="floatingInputGrid" placeholder="name@example.com" value="mdo@example.com">
            <label for="floatingInputGrid">Correo Electronico</label>
          </div>
        </div>
        <div class="col-md">
          <div class="form-floating">
            <select class="form-select" id="floatingSelectGrid">
              <option selected>Selecciona</option>
              <option value="1">Normal</option>
              <option value="2">Muy hincha</option>
              <option value="3">Fan número 1</option>
            </select>
            <label for="floatingSelectGrid">¿Que tan hincha te consideras?</label>
          </div>
        </div>
      </div>
      <hr>
      <div class="form-floating mt-2">
        <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
        <label for="floatingTextarea">Escribe aquí, que sería lo más loco que harias por este equipo.</label>
      </div>
      <br>
      <div class="d-grid gap-2 col-4 mx-auto">
        <button class="btn btn-primary" id="enviarDatos" type="button">Enviar</button>
      </div>

    </div>


</main>

<footer>
  <div class="orden-redes  col-lg-2 text-center container">
    <p><a href="./index.html" target="_blank" class="redes-sociales link-underline-dark link-offset-2">Volver al inicio ⮌ </a></p>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/javascript.js"></script>
</body>
</html>
